catalog_version: "1"
launches:
  llamacpp-hip:
    runtime: llamacpp
    container: llamacpp
    image:
      by_device:
        halo: {ref: ghcr.io/inferstation/llama-rocm-halo:commit-fe7c8b2414bb}
      build: {framework: llamacpp}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32}
    env: {}
    mods: []
    command: >-
      llama-server -m {model.path} -ngl 999 -fa on --host {host} --port {port} -c {ctx} -np {nseq}

  llamacpp-hip-no-mmap:
    runtime: llamacpp
    container: llamacpp
    image:
      by_device:
        halo: {ref: ghcr.io/inferstation/llama-rocm-halo:commit-fe7c8b2414bb}
      build: {framework: llamacpp}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32}
    env: {}
    mods: []
    command: >-
      llama-server -m {model.path} -ngl 999 -fa on --no-mmap --host {host} --port {port} -c {ctx} -np {nseq}

  llamacpp-hip-mimo:
    runtime: llamacpp
    container: llamacpp
    image:
      by_device:
        halo: {ref: ghcr.io/inferstation/llama-rocm-halo:commit-fe7c8b2414bb}
      build: {framework: llamacpp}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32}
    env: {}
    mods: []
    command: >-
      llama-server -m {model.path} -ngl 999 -fa off --no-mmap --host {host} --port {port} -c {ctx} -np {nseq}

  vllm-bf16-triton:
    runtime: vllm
    container: vllm
    image:
      by_device:
        halo: {ref: ghcr.io/inferstation/vllm-rocm-halo:arena-f5fa386fe}
      build: {framework: vllm}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32}
    env: {}
    mods: []
    command: >-
      vllm serve {model.path} --host {host} --port {port} --served-model-name {model.served_name}
      --max-num-seqs {nseq} --dtype bfloat16 --attention-backend TRITON_ATTN
      --max-model-len {ctx} --gpu-memory-utilization 0.85

  vllm-bf16-triton-no-gmu:
    runtime: vllm
    container: vllm
    image:
      by_device:
        halo: {ref: ghcr.io/inferstation/vllm-rocm-halo:arena-f5fa386fe}
      build: {framework: vllm}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32}
    env: {}
    mods: []
    command: >-
      vllm serve {model.path} --host {host} --port {port} --max-num-seqs {nseq}
      --dtype bfloat16 --attention-backend TRITON_ATTN --served-model-name {model.served_name}
      --max-model-len {ctx}

  vllm-bf16:
    runtime: vllm
    container: vllm
    image:
      by_device:
        halo: {ref: ghcr.io/inferstation/vllm-rocm-halo:arena-f5fa386fe}
      build: {framework: vllm}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32}
    env: {}
    mods: []
    command: >-
      vllm serve {model.path} --host {host} --port {port} --served-model-name {model.served_name}
      --max-num-seqs {nseq} --dtype bfloat16 --max-model-len {ctx} --gpu-memory-utilization 0.9

  vllm-awq-triton:
    runtime: vllm
    container: vllm
    image:
      by_device:
        halo: {ref: ghcr.io/inferstation/vllm-rocm-halo:arena-f5fa386fe}
      build: {framework: vllm}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32}
    env: {}
    mods: []
    command: >-
      vllm serve {model.path} --host {host} --port {port} --served-model-name {model.served_name}
      --max-num-seqs {nseq} --dtype float16 --attention-backend TRITON_ATTN
      --max-model-len {ctx} --gpu-memory-utilization 0.85

  vllm-awq:
    runtime: vllm
    container: vllm
    image:
      by_device:
        halo: {ref: ghcr.io/inferstation/vllm-rocm-halo:arena-f5fa386fe}
      build: {framework: vllm}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32}
    env: {}
    mods: []
    command: >-
      vllm serve {model.path} --host {host} --port {port} --served-model-name {model.served_name}
      --max-num-seqs {nseq} --dtype float16 --max-model-len {ctx} --gpu-memory-utilization 0.85

  vllm-quark:
    runtime: vllm
    container: vllm
    image:
      by_device:
        halo: {ref: ghcr.io/inferstation/vllm-rocm-halo:arena-f5fa386fe}
      build: {framework: vllm}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32}
    env: {}
    mods: []
    command: >-
      vllm serve {model.path} --host {host} --port {port} --served-model-name {model.served_name}
      --max-num-seqs {nseq} --quantization quark --max-model-len {ctx} --gpu-memory-utilization 0.85

  vllm-autoround-gptq:
    runtime: vllm
    container: vllm
    image:
      by_device:
        halo: {ref: ghcr.io/inferstation/vllm-rocm-halo:arena-f5fa386fe}
      build: {framework: vllm}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32}
    env:
      FLASH_ATTENTION_TRITON_AMD_ENABLE: "TRUE"
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
      TORCH_BLAS_PREFER_HIPBLASLT: "1"
      VLLM_DISABLE_COMPILE_CACHE: "1"
      TORCHINDUCTOR_AUTOGRAD_CACHE: "0"
      VLLM_MOE_HYBRID_W4A16: "1"
      PYTORCH_ROCM_ARCH: gfx1151
    mods: []
    command: >-
      vllm serve {model.path} --served-model-name {model.served_name} --host {host} --port {port}
      --trust-remote-code --dtype float16 --max-model-len {ctx} --max-num-seqs {nseq}
      --max-num-batched-tokens 8192 --gpu-memory-utilization 0.85 --attention-backend TRITON_ATTN
      --mm-encoder-attn-backend TRITON_ATTN --quantization gptq

  vllm-main-diffusion:
    runtime: vllm-main
    container: vllm-main
    image:
      by_device:
        halo: {ref: ghcr.io/inferstation/vllm-rocm-halo-main:commit-92221485aaaa}
      build: {framework: vllm-main}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 4}
    env: {}
    mods: []
    command: >-
      vllm serve {model.path} --served-model-name {model.served_name} --host {host} --port {port}
      --max-model-len 896 --max-num-seqs {nseq} --gpu-memory-utilization 0.6
      --generation-config vllm
      --hf-overrides '{"diffusion_sampler":"entropy_bound","diffusion_entropy_bound":0.1}'
      --diffusion-config '{"canvas_length":256}'

  r9700-llamacpp-hip:
    runtime: llamacpp
    backend: ROCm/HIP
    container: llamacpp
    image:
      ref: ghcr.io/inferstation/llama-rocm-r9700@sha256:5096deff2b8a02aa0b48b02e572bdbaf9bdc4e877da02252fca74a263a82f3b5
    topology: {node_count: 1, gpu_count: 1, tensor_parallel_size: 1}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32, ctx: 32768}
    env:
      HIP_VISIBLE_DEVICES: "0"
      ROCR_VISIBLE_DEVICES: "0"
      LD_LIBRARY_PATH: /app:/opt/rocm/lib
    mods: []
    command: >-
      llama-server -m {model.path} -ngl 999 -fa on --host {host} --port {port} -c {ctx} -np {nseq}
      --cache-ram 0

  r9700-vllm-tp1:
    runtime: vllm
    backend: ROCm/HIP · TRITON_ATTN
    container: vllm
    image:
      ref: ghcr.io/inferstation/vllm-rocm-r9700-main@sha256:2d3a6275b1000cc9dce4c105dae899edd95d77875ede0c4d5d9b9c53a29faaf1
    topology: {node_count: 1, gpu_count: 1, tensor_parallel_size: 1}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32, ctx: 8192}
    env:
      HIP_VISIBLE_DEVICES: "0"
      ROCR_VISIBLE_DEVICES: "0"
      TRITON_CACHE_DIR: /models/.triton-cache
    mods: []
    command: >-
      vllm serve {model.path} --served-model-name {model.served_name}
      --host {host} --port {port} --trust-remote-code --dtype bfloat16
      --max-model-len {ctx} --max-num-seqs {nseq} --gpu-memory-utilization 0.85
      --attention-backend TRITON_ATTN

  r9700-vllm-tp2:
    runtime: vllm
    backend: ROCm/HIP · TRITON_ATTN
    container: vllm
    image:
      ref: ghcr.io/inferstation/vllm-rocm-r9700-main@sha256:2d3a6275b1000cc9dce4c105dae899edd95d77875ede0c4d5d9b9c53a29faaf1
    topology: {node_count: 1, gpu_count: 2, tensor_parallel_size: 2}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32, ctx: 2304}
    env:
      HIP_VISIBLE_DEVICES: "0,1"
      ROCR_VISIBLE_DEVICES: "0,1"
      NCCL_PROTO: Simple
      NCCL_P2P_DISABLE: "1"
      TRITON_CACHE_DIR: /models/.triton-cache
    mods: []
    command: >-
      vllm serve {model.path} --served-model-name {model.served_name}
      --host {host} --port {port} --trust-remote-code --dtype bfloat16
      --max-model-len {ctx} --max-num-seqs {nseq} --gpu-memory-utilization 0.90
      --attention-backend TRITON_ATTN --tensor-parallel-size 2

  r9700-vllm-tp4:
    runtime: vllm
    backend: ROCm/HIP · TRITON_ATTN
    container: vllm
    image:
      ref: ghcr.io/inferstation/vllm-rocm-r9700-main@sha256:2d3a6275b1000cc9dce4c105dae899edd95d77875ede0c4d5d9b9c53a29faaf1
    topology: {node_count: 1, gpu_count: 4, tensor_parallel_size: 4}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32, ctx: 2304}
    env:
      HIP_VISIBLE_DEVICES: "0,1,2,3"
      ROCR_VISIBLE_DEVICES: "0,1,2,3"
      NCCL_PROTO: Simple
      NCCL_P2P_DISABLE: "1"
      TRITON_CACHE_DIR: /models/.triton-cache
    mods: []
    command: >-
      vllm serve {model.path} --served-model-name {model.served_name}
      --host {host} --port {port} --trust-remote-code --dtype bfloat16
      --max-model-len {ctx} --max-num-seqs {nseq} --gpu-memory-utilization 0.85
      --attention-backend TRITON_ATTN --tensor-parallel-size 4

  # llama.cpp spreads layers over the visible GPUs instead of sharding tensors,
  # so these declare gpu_count without tensor parallelism.
  r9700-llamacpp-hip-2gpu:
    runtime: llamacpp
    backend: ROCm/HIP
    container: llamacpp
    image:
      ref: ghcr.io/inferstation/llama-rocm-r9700@sha256:5096deff2b8a02aa0b48b02e572bdbaf9bdc4e877da02252fca74a263a82f3b5
    topology: {node_count: 1, gpu_count: 2, tensor_parallel_size: 1}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32, ctx: 32768}
    env:
      HIP_VISIBLE_DEVICES: "0,1"
      ROCR_VISIBLE_DEVICES: "0,1"
      LD_LIBRARY_PATH: /app:/opt/rocm/lib
    mods: []
    command: >-
      llama-server -m {model.path} -ngl 999 -fa on --host {host} --port {port} -c {ctx} -np {nseq}
      --cache-ram 0

  r9700-llamacpp-hip-4gpu:
    runtime: llamacpp
    backend: ROCm/HIP
    container: llamacpp
    image:
      ref: ghcr.io/inferstation/llama-rocm-r9700@sha256:5096deff2b8a02aa0b48b02e572bdbaf9bdc4e877da02252fca74a263a82f3b5
    topology: {node_count: 1, gpu_count: 4, tensor_parallel_size: 1}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32, ctx: 32768}
    env:
      HIP_VISIBLE_DEVICES: "0,1,2,3"
      ROCR_VISIBLE_DEVICES: "0,1,2,3"
      LD_LIBRARY_PATH: /app:/opt/rocm/lib
    mods: []
    command: >-
      llama-server -m {model.path} -ngl 999 -fa on --host {host} --port {port} -c {ctx} -np {nseq}
      --cache-ram 0

  # AWQ weights take 22.87 GiB of the 29.86 GiB a single R9700 exposes, so the
  # stock 0.85 utilisation leaves vLLM with -0.31 GiB for cache blocks.
  r9700-vllm-awq-tp1:
    runtime: vllm
    backend: "ROCm/HIP \xB7 TRITON_ATTN"
    container: vllm
    image:
      ref: ghcr.io/inferstation/vllm-rocm-r9700-main@sha256:2d3a6275b1000cc9dce4c105dae899edd95d77875ede0c4d5d9b9c53a29faaf1
    topology: {node_count: 1, gpu_count: 1, tensor_parallel_size: 1}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32, ctx: 4096}
    env:
      HIP_VISIBLE_DEVICES: "0"
      ROCR_VISIBLE_DEVICES: "0"
      TRITON_CACHE_DIR: /models/.triton-cache
    mods: []
    command: >-
      vllm serve {model.path} --served-model-name {model.served_name} --host {host}
      --port {port} --trust-remote-code --dtype float16 --max-model-len {ctx}
      --max-num-seqs {nseq} --gpu-memory-utilization 0.95 --attention-backend TRITON_ATTN

  # Sharding the same AWQ checkpoint over two GPUs drops the per-card weight
  # footprint to ~11.4 GiB, which is what makes it schedulable next to whatever
  # else a shared workstation happens to be running.
  r9700-vllm-awq-tp2:
    runtime: vllm
    backend: "ROCm/HIP \xB7 TRITON_ATTN"
    container: vllm
    image:
      ref: ghcr.io/inferstation/vllm-rocm-r9700-main@sha256:2d3a6275b1000cc9dce4c105dae899edd95d77875ede0c4d5d9b9c53a29faaf1
    topology: {node_count: 1, gpu_count: 2, tensor_parallel_size: 2}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32, ctx: 8192}
    env:
      HIP_VISIBLE_DEVICES: 0,1
      ROCR_VISIBLE_DEVICES: 0,1
      NCCL_PROTO: Simple
      NCCL_P2P_DISABLE: "1"
      TRITON_CACHE_DIR: /models/.triton-cache
    mods: []
    command: >-
      vllm serve {model.path} --served-model-name {model.served_name} --host {host}
      --port {port} --trust-remote-code --dtype float16 --max-model-len {ctx}
      --max-num-seqs {nseq} --gpu-memory-utilization 0.90 --attention-backend TRITON_ATTN
      --tensor-parallel-size 2

  r9700-vllm-autoround-gptq-tp1:
    runtime: vllm
    backend: "ROCm/HIP \xB7 TRITON_ATTN"
    container: vllm
    image:
      ref: ghcr.io/inferstation/vllm-rocm-r9700-main@sha256:2d3a6275b1000cc9dce4c105dae899edd95d77875ede0c4d5d9b9c53a29faaf1
    topology: {node_count: 1, gpu_count: 1, tensor_parallel_size: 1}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32, ctx: 8192}
    env:
      HIP_VISIBLE_DEVICES: "0"
      ROCR_VISIBLE_DEVICES: "0"
      TRITON_CACHE_DIR: /models/.triton-cache
      VLLM_MOE_HYBRID_W4A16: "1"
      PYTORCH_ROCM_ARCH: gfx1201
    mods: []
    command: >-
      vllm serve {model.path} --served-model-name {model.served_name} --host {host}
      --port {port} --trust-remote-code --dtype float16 --max-model-len {ctx}
      --max-num-seqs {nseq} --max-num-batched-tokens 8192 --gpu-memory-utilization 0.85
      --attention-backend TRITON_ATTN --quantization gptq

  r9700-vllm-quark-tp2:
    runtime: vllm
    backend: "ROCm/HIP \xB7 TRITON_ATTN"
    container: vllm
    image:
      ref: ghcr.io/inferstation/vllm-rocm-r9700-main@sha256:2d3a6275b1000cc9dce4c105dae899edd95d77875ede0c4d5d9b9c53a29faaf1
    topology: {node_count: 1, gpu_count: 2, tensor_parallel_size: 2}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32, ctx: 8192}
    env:
      HIP_VISIBLE_DEVICES: 0,1
      ROCR_VISIBLE_DEVICES: 0,1
      NCCL_PROTO: Simple
      NCCL_P2P_DISABLE: "1"
      TRITON_CACHE_DIR: /models/.triton-cache
    mods: []
    command: >-
      vllm serve {model.path} --served-model-name {model.served_name} --host {host}
      --port {port} --trust-remote-code --quantization quark --max-model-len {ctx}
      --max-num-seqs {nseq} --gpu-memory-utilization 0.90 --attention-backend TRITON_ATTN
      --tensor-parallel-size 2

  # llama.cpp 29b52d39 (2026-11-21) for the 2026-11 model batch; fe7c8b2414 predates
  # the qwen4exp, glm5-next, deepseek4 and bailingmoe3 architectures.
  llamacpp-hip-2611:
    runtime: llamacpp
    backend: ROCm/HIP
    container: llamacpp
    image:
      ref: ghcr.io/inferstation/llama-rocm-halo@sha256:00bbff0cae14fd6020294c01e6091b49f5b7e7fa2718e89be0a02ed40548a8ca
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32}
    env:
      LD_LIBRARY_PATH: /app:/opt/rocm/lib
    mods: []
    command: >-
      llama-server -m {model.path} -ngl 999 -fa on --host {host} --port {port} -c {ctx} -np {nseq}

  # This llama.cpp replaced --no-mmap with --load-mode none.
  llamacpp-hip-no-mmap-2611:
    runtime: llamacpp
    backend: ROCm/HIP
    container: llamacpp
    image:
      ref: ghcr.io/inferstation/llama-rocm-halo@sha256:00bbff0cae14fd6020294c01e6091b49f5b7e7fa2718e89be0a02ed40548a8ca
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32}
    env:
      LD_LIBRARY_PATH: /app:/opt/rocm/lib
    mods: []
    command: >-
      llama-server -m {model.path} -ngl 999 -fa on --load-mode none --host {host} --port {port} -c {ctx} -np {nseq}

  llamacpp-hip-mimo-2611:
    runtime: llamacpp
    backend: ROCm/HIP
    container: llamacpp
    image:
      ref: ghcr.io/inferstation/llama-rocm-halo@sha256:00bbff0cae14fd6020294c01e6091b49f5b7e7fa2718e89be0a02ed40548a8ca
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32}
    env:
      LD_LIBRARY_PATH: /app:/opt/rocm/lib
    mods: []
    command: >-
      llama-server -m {model.path} -ngl 999 -fa off --load-mode none --host {host} --port {port} -c {ctx} -np {nseq}

  r9700-llamacpp-hip-2611:
    runtime: llamacpp
    backend: ROCm/HIP
    container: llamacpp
    image:
      ref: ghcr.io/inferstation/llama-rocm-r9700@sha256:3aca429eea682400c8b6539d6839cd1706bd7c5aa3d2d4bbd6b036cd7bbd559b
    topology: {node_count: 1, gpu_count: 1, tensor_parallel_size: 1}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32, ctx: 32768}
    env:
      HIP_VISIBLE_DEVICES: "0"
      ROCR_VISIBLE_DEVICES: "0"
      LD_LIBRARY_PATH: /app:/opt/rocm/lib
    mods: []
    command: >-
      llama-server -m {model.path} -ngl 999 -fa on --host {host} --port {port} -c {ctx} -np {nseq}
      --cache-ram 0

  r9700-llamacpp-hip-2gpu-2611:
    runtime: llamacpp
    backend: ROCm/HIP
    container: llamacpp
    image:
      ref: ghcr.io/inferstation/llama-rocm-r9700@sha256:3aca429eea682400c8b6539d6839cd1706bd7c5aa3d2d4bbd6b036cd7bbd559b
    topology: {node_count: 1, gpu_count: 2, tensor_parallel_size: 1}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32, ctx: 32768}
    env:
      HIP_VISIBLE_DEVICES: "0,1"
      ROCR_VISIBLE_DEVICES: "0,1"
      LD_LIBRARY_PATH: /app:/opt/rocm/lib
    mods: []
    command: >-
      llama-server -m {model.path} -ngl 999 -fa on --host {host} --port {port} -c {ctx} -np {nseq}
      --cache-ram 0

  r9700-llamacpp-hip-4gpu-2611:
    runtime: llamacpp
    backend: ROCm/HIP
    container: llamacpp
    image:
      ref: ghcr.io/inferstation/llama-rocm-r9700@sha256:3aca429eea682400c8b6539d6839cd1706bd7c5aa3d2d4bbd6b036cd7bbd559b
    topology: {node_count: 1, gpu_count: 4, tensor_parallel_size: 1}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32, ctx: 32768}
    env:
      HIP_VISIBLE_DEVICES: "0,1,2,3"
      ROCR_VISIBLE_DEVICES: "0,1,2,3"
      LD_LIBRARY_PATH: /app:/opt/rocm/lib
    mods: []
    command: >-
      llama-server -m {model.path} -ngl 999 -fa on --host {host} --port {port} -c {ctx} -np {nseq}
      --cache-ram 0

  r9700-llamacpp-hip-mimo-4gpu-2611:
    runtime: llamacpp
    backend: ROCm/HIP
    container: llamacpp
    image:
      ref: ghcr.io/inferstation/llama-rocm-r9700@sha256:3aca429eea682400c8b6539d6839cd1706bd7c5aa3d2d4bbd6b036cd7bbd559b
    topology: {node_count: 1, gpu_count: 4, tensor_parallel_size: 1}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32, ctx: 32768}
    env:
      HIP_VISIBLE_DEVICES: "0,1,2,3"
      ROCR_VISIBLE_DEVICES: "0,1,2,3"
      LD_LIBRARY_PATH: /app:/opt/rocm/lib
    mods: []
    command: >-
      llama-server -m {model.path} -ngl 999 -fa off --load-mode none --host {host} --port {port} -c {ctx} -np {nseq}
      --cache-ram 0

  # llama.cpp 29b52d39 (same source as the 2026-11-21 InferStation images) compiled for gfx1100 on the
  # test machine with the llama-rocm recipe flags; the ref names that local build, it is not a published image.
  # HSA_NO_SCRATCH_RECLAIM / HIP_FORCE_DEV_KERNARG are kept from earlier W7900 runs; they did not stop the
  # mid-benchmark stalls seen on 2026-11-24, which were KFD queue evictions on the test machine.
  w7900-llamacpp-hip-2611:
    runtime: llamacpp
    backend: ROCm/HIP
    container: llamacpp
    image:
      ref: ghcr.io/inferstation/llama-rocm-w7900:commit-29b52d398b29
    topology: {node_count: 1, gpu_count: 1, tensor_parallel_size: 1}
    defaults: {port: 8000, host: 0.0.0.0, nseq: 32, ctx: 32768}
    env:
      HIP_VISIBLE_DEVICES: "0"
      ROCR_VISIBLE_DEVICES: "0"
      LD_LIBRARY_PATH: /app:/opt/rocm/lib
      HSA_NO_SCRATCH_RECLAIM: "1"
      HIP_FORCE_DEV_KERNARG: "1"
    mods: []
    command: >-
      llama-server -m {model.path} -ngl 999 -fa on --host {host} --port {port} -c {ctx} -np {nseq}
      --cache-ram 0

